# Qdrant server with monitoring (issue M5-1, PROTOCOL.md §12 "Online service").
#
#   docker compose -f docker/docker-compose.yml up -d
#   Qdrant REST/dashboard  http://localhost:6333/dashboard   gRPC  localhost:6334
#   Prometheus             http://localhost:9090
#   Grafana                http://localhost:3000             (admin / admin)
#
# Qdrant storage persists under data/qdrant_server/ (git-ignored). Images are pinned; bump
# them deliberately and re-run the parity test (tests/integration/test_qdrant_server_parity.py).
name: avr

services:
  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: avr_qdrant
    restart: unless-stopped
    # run as the host user so data/qdrant_server/ stays owned by the checkout's owner
    # (create the directory before the first `up`, see README.md)
    user: "${AVR_UID:-1000}:${AVR_GID:-1000}"
    ports:
      - "6333:6333" # REST API and web dashboard at /dashboard
      - "6334:6334" # gRPC
    volumes:
      - ../data/qdrant_server:/qdrant/storage
    environment:
      QDRANT__SERVICE__ENABLE_CORS: "true"
      # keep snapshots inside the mounted storage so the non-root user can write them
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/snapshots
      QDRANT__LOG_LEVEL: INFO

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: avr_prometheus
    restart: unless-stopped
    depends_on:
      - qdrant
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d

  grafana:
    image: grafana/grafana:11.5.2
    container_name: avr_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # local monitoring stack: read-only dashboards without a login
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/qdrant.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  prometheus_data:
  grafana_data:
