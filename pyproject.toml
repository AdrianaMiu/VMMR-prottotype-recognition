[project]
name = "avr"
version = "0.1.0"
description = "Fine-grained vehicle make, model and generation recognition on CompCars with frozen visual encoders and viewpoint-aware prototypes"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "hydra-core>=1.3,<2",
    "omegaconf>=2.3,<3",
    "pydantic>=2.11,<3",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyarrow>=19,<21",
    "mlflow>=2.22,<3",
    "scipy>=1.15,<2",
    "pillow>=11,<14",
    "pyyaml>=6.0,<7",
    "faiss-cpu>=1.15.1",
    "scikit-learn>=1.9.1",
    "imagehash>=4.3.2",
]

[project.optional-dependencies]
gpu = [
    "rfdetr>=1.8.3",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "transformers>=5,<6",
    "open_clip_torch>=2.32,<3",
    "timm>=1.0,<2",
    "safetensors>=0.5,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
    "pre-commit>=4.2,<5",
    "dvc>=3.59,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avr"]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
